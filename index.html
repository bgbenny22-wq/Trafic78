    /* ================= HEADER ================= */

    header {
      position: absolute;

      left: 0;
      width: 100%;
      z-index: 100;

      display: flex;

      background: linear-gradient(

      );
    }

    .brand {

      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 38px;
      line-height: 1;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 1000;
      letter-spacing: -1px;
    }

    .brand-name span {
      color: #e10600;
    }

    nav {

      gap: 28px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      transition: .2s;
    }

    nav a:hover {
      color: #e10600;
    }

    /* ================= HERO ================= */

    .hero {
      min-height: 100vh;
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: center;

      background:
        linear-gradient(

          rgba(0,0,0,.98) 0%,
          rgba(0,0,0,.88) 38%,
          rgba(0,0,0,.35) 65%,
          rgba(0,0,0,.65) 100%
        ),
        url("trafik78-kamion-1.jpg") center right / cover no-repeat;

      border-bottom: 5px solid #e10600;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          135deg,
          transparent 55%,
          rgba(225,6,0,.35) 56%,
          transparent 57%
        );

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 10;

      width: 55%;
      padding-left: 7%;
      padding-top: 60px;
    }

    .tag {
      display: inline-block;

      color: #fff;
      background: #e10600;

      padding: 9px 15px;
      margin-bottom: 20px;

      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;

      transform: skew(-8deg);
    }

    h1 {
      font-size: clamp(65px, 9vw, 125px);
      line-height: .85;
      font-weight: 1000;
      letter-spacing: -7px;
      text-transform: uppercase;

      text-shadow: 0 10px 40px #000;

    h1 span {
      color: #e10600;

    .hero-title {

      margin-top: 20px;

      font-weight: 1000;
      text-transform: uppercase;

      border-radius: 4px;

      transition: .25s;
    }

    .btn-red {
      background: #e10600;
      color: white;

      box-shadow: 0 10px 35px rgba(225,6,0,.45);
    }

    .btn-red:hover {
      background: #ff1b14;
      transform: translateY(-3px);
    }

    .btn-dark {
      color: white;
      border: 2px solid #777;
      background: rgba(0,0,0,.6);
    }

    .btn-dark:hover {
      border-color: #e10600;
      color: #e10600;
    }

      left: 7%;

      gap: 15px;

      background: rgba(0,0,0,.75);

      font-weight: 800;

      text-align: center;

      color: #999;

      line-height: 1.6;
    }

      margin-top: 55px;

      padding: 40px 30px;

      background:

          #181818,
          #080808
        );

      border: 1px solid #292929;
      border-top: 5px solid #e10600;

      transition: .3s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #e10600;
      box-shadow: 0 20px 50px rgba(225,6,0,.12);
    }

    .card-number {
      color: #e10600;
      font-size: 16px;
      font-weight: 1000;
    }

    .card h3 {
      margin: 18px 0 12px;
      font-size: 26px;
    }

    .card p {
      color: #aaa;
      line-height: 1.7;
    }

    /* ================= FLEET ================= */

    .fleet {
      background:
        linear-gradient(
          rgba(225,6,0,.07),
          rgba(0,0,0,0)
        ),
        #050505;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 20px;

      margin-top: 55px;
    }

    .gallery-item {
      position: relative;

      height: 360px;

      overflow: hidden;

      border: 2px solid #222;
      background: #111;
    }

    .gallery-item::after {
      content: "ТРАФИК78";

      position: absolute;
      left: 20px;
      bottom: 15px;

      padding: 7px 12px;

      background: #e10600;

      font-size: 16px;
      font-weight: 1000;

      z-index: 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition: .5s;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* ================= ABOUT ================= */

    .about-box {

      margin: 45px auto 0;

      background: #111;

      border-left: 6px solid #e10600;

    }

    .about-box p {
      color: #ccc;

      color: #aaa;

    }

      justify-content: center;

      gap: 15px;

      margin-top: 35px;
    }

    .contact-button {
      display: inline-block;

      padding: 18px 28px;

      color: white;
      text-decoration: none;

      background: #e10600;

      font-size: 18px;
      font-weight: 1000;

      border-radius: 4px;

      transition: .25s;
    }

    .contact-button:hover {
      background: #ff211a;
      transform: translateY(-3px);
    }

    .contact-button.email {
      background: #151515;
      border: 2px solid #444;
    }

    .contact-button.email:hover {
      border-color: #e10600;
      background: #151515;
    }

    /* ================= FOOTER ================= */

    footer {
      padding: 30px 7%;

      background: #020202;

      border-top: 1px solid #222;

      text-align: center;

      color: #777;
    }

    footer strong {
      color: white;
    }
